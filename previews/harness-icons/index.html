<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillBridge · 来源图标预览</title>
<style>
:root{color-scheme:light;--ink:#18181b;--muted:#9696a1;--bg:#f5f5f3;--fill:#eaeae8;--accent:#5346f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:860px;padding:44px 32px;margin:auto}h1{font-size:32px;letter-spacing:-1px;margin:0 0 6px}p{margin:0;color:#77777f}.eyebrow{font-size:12px;color:#77777f;margin-bottom:6px}.comparison{margin:32px 0 36px;border-top:1px solid #dededb}.sample{padding:24px 0;border-bottom:1px solid #dededb}.label{display:flex;gap:10px;align-items:center;margin-bottom:16px}.label b{font-size:13px;font-weight:600}.label span{color:#898991;font-size:12px}.toolbar{display:flex;align-items:center;gap:12px}.search{display:flex;align-items:center;gap:8px;flex:1;background:#fff;border:1px solid #d5d5d9;border-radius:999px;height:38px;padding:0 12px;color:#66666e}.search input{border:0;outline:none;min-width:0;width:100%;font:inherit;background:none}.search:focus-within{outline:2px solid var(--accent);outline-offset:3px}.seg{position:relative;display:flex;flex:none;isolation:isolate;padding:3px;background:var(--fill);border-radius:999px;--i:2}.seg button{position:relative;z-index:1;display:grid;place-items:center;width:36px;height:34px;border:0;border-radius:999px;background:none;color:var(--muted);padding:0;cursor:pointer;transition:color 200ms,transform 160ms cubic-bezier(.2,.8,.2,1)}button:hover{color:var(--ink)}.seg button.on{color:var(--ink)}.seg button:active{transform:scale(.88)}.seg-ind{position:absolute;left:3px;top:3px;width:36px;height:34px;border-radius:999px;background:white;box-shadow:0 1px 2px #14142814,0 4px 10px -4px #1414282e;transform:translateX(calc(var(--i)*36px));transition:transform 420ms cubic-bezier(.22,1.15,.36,1)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.icon{display:block;width:17px;height:17px}.hermes{width:19px;height:19px;mix-blend-mode:multiply;opacity:.45;transition:opacity 200ms}.on .hermes,button:hover .hermes,.legend .hermes{opacity:1}.pi{fill:currentColor;stroke:none}.plus{font-size:25px;font-weight:300;margin-left:2px}.state{font-size:12px;color:#77777f;text-align:right;margin-top:12px;min-height:18px}.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;text-align:center;margin:20px 0 32px}.legend figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}.legend .icon{width:32px;height:32px}.legend .hermes{width:36px;height:36px}.legend .mark{height:40px;display:grid;place-items:center}.legend figcaption{font-size:13px}.legend small{display:block;color:#99999f;font-size:11px;margin-top:3px}.future{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #dededb;padding-top:24px}.future p{font-size:12px}.references{margin-top:28px;color:#909098;font-size:11px}.references a{color:inherit;text-decoration:underline;text-underline-offset:3px}.preview{display:inline-block;padding:2px 8px;border-radius:999px;color:#685bdb;background:#eeedfe;font-size:11px;margin-left:9px;vertical-align:middle}@media(max-width:600px){main{padding:28px 18px}h1{font-size:27px}.toolbar{gap:8px}.search{min-width:90px;font-size:12px}.legend{gap:4px}.legend figcaption{font-size:11px}.legend small{font-size:10px}.future{flex-direction:column;align-items:flex-start}.plus{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<div class="eyebrow">SkillBridge / 局部预览</div><h1>来源图标<span class="preview">待确认</span></h1><p>保持胶囊按钮、灰黑配色和滑动选中效果。</p>
<div class="comparison">
 <section class="sample"><div class="label"><b>现在</b><span>Hermes 与 SkillBridge 使用相同文件夹</span></div><div class="toolbar"><label class="search"><span data-icon="search"></span><input placeholder="搜索名称或用途" aria-label="现在的搜索框"></label><div class="seg" data-group="old" role="radiogroup" aria-label="当前来源"></div><span class="plus">+</span></div></section>
 <section class="sample"><div class="label"><b>调整后</b><span>官方图形与项目标识</span></div><div class="toolbar"><label class="search"><span data-icon="search"></span><input placeholder="搜索名称或用途" aria-label="预览搜索框"></label><div class="seg" data-group="new" role="radiogroup" aria-label="新版来源"></div><span class="plus">+</span></div><div class="state" id="state" aria-live="polite">Hermes</div></section>
</div>
<div class="legend" id="legend"></div>
<div class="future"><div><b>全部图标</b><p>点击或用方向键切换；悬停显示名称。</p></div><div class="seg" data-group="full" role="radiogroup" aria-label="全部品牌预览"></div></div>
<div class="references">参考：<a href="https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/static/img/favicon.svg" target="_blank" rel="noreferrer">Hermes 官网图标</a> · <a href="https://github.com/earendil-works/pi-website/blob/main/src/logo.svg" target="_blank" rel="noreferrer">Pi 官方图形</a> · <a href="https://claude.com/" target="_blank" rel="noreferrer">Claude 星芒</a>。Codex、SkillBridge 沿用当前界面图形。预览不读取或修改档案。</div>
</main><script src="preview.js"></script></body></html>
